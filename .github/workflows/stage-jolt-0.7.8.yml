          +++ b/jukebox/guest.py
          @@ -0,0 +1,266 @@
          +import json
          +import socket
          +from concurrent.futures import Future, TimeoutError
          +from http import HTTPStatus
          +from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          +from ipaddress import IPv4Address
          +from itertools import islice
          +from queue import Full, Queue
          +from secrets import token_urlsafe
          +from socketserver import TCPServer
          +from threading import BoundedSemaphore, Thread
          +from urllib.parse import parse_qs
          +
          +from PySide6.QtNetwork import QNetworkInterface
          +from qrcode import QRCode
          +from qrcode.image.svg import SvgPathFillImage
          +
          +
          +_PAGE = b"""<!doctype html>
          +<html lang="en">
          +<head>
          +<meta charset="utf-8">
          +<meta name="viewport" content="width=device-width, initial-scale=1">
          +<title>JOLT Guest Queue</title>
          +<style>
          +:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#080e18;color:#edf4ff}
          +body{margin:0}main{max-width:38rem;margin:auto;padding:24px 16px}h1{font-size:1.65rem;margin:0 0 16px}
          +label{display:block;margin-bottom:6px}input{width:100%;box-sizing:border-box;border:1px solid #42617c;
          +background:#132239;color:inherit;border-radius:10px;padding:12px;font:inherit}
          +#status{min-height:1.5em;color:#b7cce2}.song{display:flex;align-items:center;gap:12px;padding:12px;
          +margin-bottom:8px;border:1px solid #294563;background:#132239;border-radius:10px}
          +.details{flex:1;min-width:0;overflow-wrap:anywhere}.album{display:block;color:#b7cce2;margin-top:3px}
          +button{flex:none;min-height:44px;padding:8px 14px;background:#77e3ff;color:#071523;border:0;
          +border-radius:8px;font:inherit;font-weight:650}button:disabled{opacity:.65}button:focus-visible,input:focus-visible{
          +outline:2px solid #91ffad;outline-offset:2px}
          +</style>
          +</head>
          +<body><main>
          +<h1>JOLT Guest Queue</h1>
          +<label for="search">Search songs, artists or albums</label>
          +<input id="search" type="search" maxlength="120" autocomplete="off" enterkeyhint="search">
          +<p id="status" role="status"></p><div id="songs"></div>
          +</main>
          +<script>
          +const search = document.querySelector("#search");
          +const status = document.querySelector("#status");
          +const songs = document.querySelector("#songs");
          +const base = location.pathname;
          +let revision = 0, debounce;
          +async function lookup() {
          +  const request = ++revision;
          +  try {
          +    const response = await fetch(base + "/songs?q=" + encodeURIComponent(search.value));
          +    if (!response.ok) throw Error();
          +    const matches = await response.json();
          +    if (request !== revision) return;
          +    songs.replaceChildren();
          +    status.textContent = matches.length ? "" : "No songs found.";
          +    for (const song of matches) {
          +      const row = document.createElement("div");
          +      row.className = "song";
          +      const details = document.createElement("div");
          +      details.className = "details";
          +      const title = document.createElement("strong");
          +      title.textContent = song.title;
          +      const album = document.createElement("small");
          +      album.className = "album";
          +      album.textContent = [song.artist, song.album].filter(Boolean).join(" / ");
          +      const add = document.createElement("button");
          +      add.textContent = "Add";
          +      add.setAttribute("aria-label", "Add " + song.title);
          +      add.onclick = async () => {
          +        add.disabled = true;
          +        try {
          +          const result = await fetch(base + "/queue", {
          +            method:"POST", headers:{"Content-Type":"application/json"},
          +            body:JSON.stringify({id:song.id})
          +          });
          +          const reply = await result.json();
          +          status.textContent = reply.message;
          +          if (!result.ok) add.disabled = false;
          +          else add.textContent = "Added";
          +          if (result.status === 409) lookup();
          +        } catch {
          +          status.textContent = "Could not reach JOLT. Check your Wi-Fi and try again.";
          +          add.disabled = false;
          +        }
          +      };
          +      details.append(title, album);
          +      row.append(details, add);
          +      songs.append(row);
          +    }
          +  } catch {
          +    if (request === revision) status.textContent = "Could not reach JOLT. Check your Wi-Fi and try again.";
          +  }
          +}
          +search.addEventListener("input", () => {
          +  revision++;
          +  clearTimeout(debounce);
          +  debounce = setTimeout(lookup, 180);
          +});
          +lookup();
          +</script></body></html>"""
          +
          +
          +def _private_ipv4(address):
          +    ip = IPv4Address(address)
          +    return ip.is_private and not (ip.is_loopback or ip.is_link_local or ip.is_unspecified)
          +
          +
          +def lan_address():
          +    """Prefer the IPv4 interface used by the OS route; this sends no packet."""
          +    try:
          +        with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as route:
          +            route.connect(("192.0.2.1", 9))
          +            address = route.getsockname()[0]
          +        if _private_ipv4(address):
          +            return address
          +    except OSError:
          +        pass
          +    for interface in QNetworkInterface.allInterfaces():
          +        if interface.type() not in (QNetworkInterface.InterfaceType.Wifi, QNetworkInterface.InterfaceType.Ethernet):
          +            continue
          +        if not interface.flags() & QNetworkInterface.InterfaceFlag.IsRunning:
          +            continue
          +        for entry in interface.addressEntries():
          +            address = entry.ip()
          +            if address.toIPv4Address() and _private_ipv4(address.toString()):
          +                return address.toString()
          +    return ""
          +
          +
          +def queue_qr(url):
          +    qr = QRCode(image_factory=SvgPathFillImage, border=4)
          +    qr.add_data(url)
          +    return qr.make_image().to_string(encoding="unicode")
          +
          +
          +class _GuestHandler(BaseHTTPRequestHandler):
          +    def setup(self):
          +        self.request.settimeout(5)
          +        super().setup()
          +
          +    def log_message(self, *_args):
          +        pass
          +
          +    def _reply(self, status, payload, mime):
          +        self.send_response(status)
          +        self.send_header("Content-Type", mime)
          +        self.send_header("Content-Length", str(len(payload)))
          +        self.send_header("Cache-Control", "no-store")
          +        self.send_header("Referrer-Policy", "no-referrer")
          +        self.send_header("X-Content-Type-Options", "nosniff")
          +        self.send_header("Content-Security-Policy",
          +                         "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; "
          +                         "connect-src 'self'; frame-ancestors 'none'; base-uri 'none'")
          +        self.end_headers()
          +        self.wfile.write(payload)
          +
          +    def _json(self, status, body):
          +        self._reply(status, json.dumps(body).encode("utf-8"), "application/json")
          +
          +    def _valid_host(self):
          +        return self.headers.get("Host") == self.server.authority
          +
          +    def do_GET(self):
          +        path, _, parameters = self.path.partition("?")
          +        if not self._valid_host():
          +            self.send_error(HTTPStatus.NOT_FOUND)
          +        elif path == self.server.route:
          +            self._reply(HTTPStatus.OK, _PAGE, "text/html; charset=utf-8")
          +        elif path == self.server.route + "/songs":
          +            query = parse_qs(parameters).get("q", [""])[0][:120]
          +            self._json(HTTPStatus.OK, self.server.search(query))
          +        else:
          +            self.send_error(HTTPStatus.NOT_FOUND)
          +
          +    def do_POST(self):
          +        if not self._valid_host() or self.path != self.server.route + "/queue":
          +            self.send_error(HTTPStatus.NOT_FOUND)
          +            return
          +        origin = self.headers.get("Origin")
          +        if origin and origin != f"http://{self.server.authority}":
          +            self.send_error(HTTPStatus.FORBIDDEN)
          +            return
          +        try:
          +            length = int(self.headers.get("Content-Length", "0"))
          +            if not 0 < length <= 512 or self.headers.get_content_type() != "application/json":
          +                raise ValueError
          +            body = json.loads(self.rfile.read(length))
          +            identifier = body["id"]
          +            if not isinstance(identifier, str) or len(identifier) > 64:
          +                raise ValueError
          +        except (OSError, ValueError, KeyError, TypeError):
          +            self._json(HTTPStatus.BAD_REQUEST, {"message": "Invalid song request."})
          +            return
          +        response = Future()
          +        try:
          +            self.server.requests.put_nowait((identifier, response))
          +            status, message = response.result(timeout=2)
          +        except Full:
          +            status, message = HTTPStatus.SERVICE_UNAVAILABLE, "JOLT is busy. Try again."
          +        except TimeoutError:
          +            if response.cancel():
          +                status, message = HTTPStatus.SERVICE_UNAVAILABLE, "JOLT is busy. Try again."
          +            else:
          +                status, message = response.result()
          +        self._json(status, {"message": message})
          +
          +
          +class GuestQueueServer(ThreadingHTTPServer):
          +    def __init__(self, address):
          +        super().__init__((address, 0), _GuestHandler)
          +        self.authority = f"{address}:{self.server_port}"
          +        self.route = "/" + token_urlsafe(16)
          +        self.url = f"http://{self.authority}{self.route}"
          +        self.requests = Queue(maxsize=32)
          +        self._workers = BoundedSemaphore(24)
          +        self._catalog = ("", ())
          +        Thread(target=self.serve_forever, kwargs={"poll_interval": 0.1}, daemon=True).start()
          +
          +    def server_bind(self):
          +        TCPServer.server_bind(self)
          +        self.server_name, self.server_port = self.server_address
          +
          +    def process_request(self, request, address):
          +        if not self._workers.acquire(blocking=False):
          +            self.shutdown_request(request)
          +            return
          +        try:
          +            super().process_request(request, address)
          +        except BaseException:
          +            self._workers.release()
          +            raise
          +
          +    def process_request_thread(self, request, address):
          +        try:
          +            super().process_request_thread(request, address)
          +        finally:
          +            self._workers.release()
          +
          +    def set_tracks(self, tracks):
          +        self._catalog = (token_urlsafe(8), tuple(tracks))
          +
          +    def search(self, query):
          +        generation, tracks = self._catalog
          +        words = query.casefold().split()
          +        matches = ((index, track) for index, track in enumerate(tracks) if track.matches(words))
          +        songs = []
          +        for index, track in islice(matches, 35):
          +            folders = track.folder.replace(chr(92), "/").split("/")
          +            songs.append({"id": f"{generation}:{index}", "title": track.title, "album": track.album,
          +                          "artist": folders[-2] if len(folders) > 1 else ""})
          +        return songs
          +
          +    def track(self, identifier):
          +        generation, tracks = self._catalog
          +        supplied, _, index = identifier.partition(":")
          +        if supplied != generation or not index.isascii() or not index.isdecimal():
          +            return None
          +        position = int(index)
          +        return tracks[position] if position < len(tracks) else None
          +
          +    def close(self):
          +        self.shutdown()
          +        self.server_close()
          
          JOLT_PATCH
