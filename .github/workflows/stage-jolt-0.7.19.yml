          The phone guest queue now follows the desktop JOLT design.
          
          - Browse four covers per page with thumb-friendly navigation and disc labels.
          - Album artwork stays in view while tracks scroll. Guests can browse adjacent albums and see which songs are queued.
          - The queue shows cover thumbnails and a Now Playing card.
          - The new JOLT logo appears on the touchscreen, phone, and TV display.
          
          On Ubuntu, open Settings and choose Update JOLT.
