          gh release create v0.7.13 "$new" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'JOLT 0.7.13' --notes-file - <<'JOLT_NOTES'
          Pair the NVIDIA Shield with a six-digit code. In JOLT, open Settings, TV Display, then Get pairing code. Enter the code in the JOLT TV 0.2.0 preview APK on the same network. The full display address is still available.
          
          If the Shield has the 0.1.0 preview installed, uninstall it before installing 0.2.0 because the signing key changed.
          
          To update from JOLT, open Settings and choose Update JOLT.
