          JOLT visual refresh for the touchscreen, guest phone queue, and TV Display.
          
          - Larger album covers, clearer artist and album labels, and separate track numbers when filenames include them.
          - Roomier phone grid with larger touch targets, fixed cover alignment, and bottom paging controls.
          - TV layout with more room around track details and a guest QR code farther from the screen edges.
          
          To update an existing desktop installation, open Settings and choose Update JOLT.
