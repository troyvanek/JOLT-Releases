name: Build JOLT installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published JOLT version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  ubuntu-deb:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Package and attach Ubuntu installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          wheel="jukebox_touchscreen_desktop-$version-py3-none-any.whl"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$wheel"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | jq -er --arg wheel "$wheel" '.assets[] | select(.name == $wheel) | .digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "${digest#sha256:}" "$wheel" | sha256sum -c -
          mkdir -p pkg/{DEBIAN,usr/bin,usr/share/jolt,usr/share/applications,usr/share/icons/hicolor/scalable/apps}
          cp "$wheel" pkg/usr/share/jolt/
          cat > pkg/DEBIAN/control <<'JOLT_FILE_0'
          Package: jolt-touchscreen
          Version: 0.7.0
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: JOLT
          Depends: python3 (>= 3.11), python3-venv, zenity, util-linux, libegl1, libgl1, libxcb-cursor0, libxcb-icccm4, libxcb-keysyms1, libxcb-render-util0, libxcb-xinerama0, libxkbcommon-x11-0, libnss3, libasound2t64, libdbus-1-3, libpulse0, libgbm1
          Suggests: gnome-keyring
          Description: JOLT touchscreen jukebox
           Browse and play local or SMB music libraries. Includes audio bars and a
           MilkDrop-compatible visualizer. The first launch downloads Python runtime
           dependencies into a private virtual environment for the desktop user.
          JOLT_FILE_0
          cat > pkg/usr/bin/jolt <<'JOLT_FILE_1'
          #!/bin/sh
          set -eu
          umask 077
          
          app_dir="${XDG_DATA_HOME:-$HOME/.local/share}/jolt"
          venv="$app_dir/venv"
          wheel="/usr/share/jolt/jukebox_touchscreen_desktop-0.7.0-py3-none-any.whl"
          mkdir -p "$app_dir"
          log="$app_dir/setup.log"
          
          needs_install() {
              [ -x "$venv/bin/jukebox" ] && "$venv/bin/python" -c '
          from importlib.metadata import version
          installed = tuple(map(int, version("jukebox-touchscreen-desktop").split(".")))
          raise SystemExit(installed < (0, 7, 0))
          ' >/dev/null 2>&1 && return 1
              return 0
          }
          
          exec 9>"$app_dir/setup.lock"
          flock 9
          if needs_install; then
              status="$app_dir/setup-status"
              rm -f "$status"
              (
                  set +e
                  printf '# Installing JOLT dependencies. This can take a few minutes.\n'
                  (
                      set -e
                      if [ ! -x "$venv/bin/python" ] || ! "$venv/bin/python" -m pip --version >/dev/null 2>&1; then
                          python3 -m venv --upgrade "$venv"
                      fi
                      "$venv/bin/python" -m pip --disable-pip-version-check install --upgrade "$wheel"
                  ) >"$log" 2>&1
                  printf '%s\n' "$?" >"$status"
                  printf '100\n'
              ) | zenity --progress --pulsate --auto-close --no-cancel --title="Set up JOLT" ||
                  true
              if [ ! -f "$status" ] || [ "$(cat "$status")" -ne 0 ] || needs_install; then
                  zenity --error --title="JOLT setup failed" \
                      --text="JOLT could not finish setup. Check your internet connection and open JOLT again. Setup log: $log" || true
                  exit 1
              fi
          fi
          flock -u 9
          exec 9>&-
          exec "$venv/bin/jukebox" "$@"
          JOLT_FILE_1
          cat > pkg/usr/share/applications/jolt-touchscreen.desktop <<'JOLT_FILE_2'
          [Desktop Entry]
          Type=Application
          Name=JOLT
          Comment=Touchscreen music jukebox
          Exec=/usr/bin/jolt
          Icon=jolt-touchscreen
          Terminal=false
          Categories=AudioVideo;Audio;Player;
          StartupNotify=true
          JOLT_FILE_2
          cat > pkg/usr/share/icons/hicolor/scalable/apps/jolt-touchscreen.svg <<'JOLT_FILE_3'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect x="4" y="4" width="120" height="120" rx="28" fill="#080e18" stroke="#39caff" stroke-width="6"/>
            <path d="M73 16 36 72h25l-7 40 39-60H68z" fill="#59ff9d"/>
          </svg>
          JOLT_FILE_3
          sed -i "s/^Version: 0.7.0$/Version: $version/" pkg/DEBIAN/control
          sed -i "s@/usr/share/jolt/jukebox_touchscreen_desktop-0.7.0-py3-none-any.whl@/usr/share/jolt/$wheel@; s/(0, 7, 0)/(${version//./, })/" pkg/usr/bin/jolt
          chmod 755 pkg/usr/bin/jolt
          sh -n pkg/usr/bin/jolt
          output="jolt-touchscreen_${version}_amd64.deb"
          dpkg-deb --root-owner-group --build pkg "$output"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$output" >/dev/null; then
            echo "Ubuntu package is already attached."
          else
            gh release upload "$RELEASE_TAG" "$output" --repo "$GITHUB_REPOSITORY"
          fi

  windows:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Download and verify the JOLT wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          $wheel = "jukebox_touchscreen_desktop-$version-py3-none-any.whl"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed' }
          $asset = $release.assets | Where-Object name -eq $wheel
          if (-not $asset -or $asset.digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Release is missing a verifiable wheel' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Wheel download failed' }
          if ("sha256:$((Get-FileHash $wheel).Hash.ToLowerInvariant())" -ne $asset.digest) { throw 'Wheel checksum mismatch' }
          "JOLT_VERSION=$version" >> $env:GITHUB_ENV
          "JOLT_WHEEL=$wheel" >> $env:GITHUB_ENV
      - name: Build JOLT for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install "./$env:JOLT_WHEEL" "PyInstaller>=6.16,<7"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -c "from jukebox.app import main; from keyring.backends.Windows import WinVaultKeyring; from PySide6.QtWebEngineQuick import QtWebEngineQuick"
          if ($LASTEXITCODE -ne 0) { throw 'Windows imports failed' }
          @'
          from jukebox.app import main
          if __name__ == "__main__":
              raise SystemExit(main())
          '@ | Set-Content -Encoding utf8 launcher.py
          python -m PyInstaller --noconfirm --windowed --onedir --name JOLT `
            --collect-data jukebox --hidden-import keyring.backends.Windows `
            --hidden-import PySide6.QtWebEngineQuick launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          if (-not (Test-Path dist/JOLT/JOLT.exe)) { throw 'Missing JOLT executable' }
          if (-not (Get-ChildItem dist/JOLT -Recurse -Filter QtWebEngineProcess.exe)) { throw 'Missing MilkDrop browser engine' }
          if (-not (Get-ChildItem dist/JOLT -Recurse -Filter index.html | Where-Object FullName -Match 'milkdrop')) { throw 'Missing MilkDrop assets' }
      - name: Create the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          @"
          [Setup]
          AppId=JOLT.TouchscreenJukebox
          AppName=JOLT
          AppVersion=$env:JOLT_VERSION
          DefaultDirName={localappdata}\Programs\JOLT
          DefaultGroupName=JOLT
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=release
          OutputBaseFilename=JOLT-$env:JOLT_VERSION-Windows-x64-Setup
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "dist\JOLT\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\JOLT"; Filename: "{app}\JOLT.exe"
          [Run]
          Filename: "{app}\JOLT.exe"; Description: "Open JOLT"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding utf8 JOLT.iss
          & $compiler JOLT.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: jolt-windows-x64-installer
          path: release/JOLT-*-Windows-x64-Setup.exe
          if-no-files-found: error

  attach:
    runs-on: ubuntu-24.04
    needs: windows
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jolt-windows-x64-installer
      - name: Attach the Windows installer to the same release
        run: gh release upload "$RELEASE_TAG" "JOLT-${RELEASE_TAG#v}-Windows-x64-Setup.exe" --repo "$GITHUB_REPOSITORY"
