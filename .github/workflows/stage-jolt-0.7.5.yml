          --- /dev/null
          +++ b/jukebox/cast.py
          @@ -0,0 +1,419 @@
          +import logging
          +import re
          +import secrets
          +import socket
          +from concurrent.futures import ThreadPoolExecutor
          +from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          +from pathlib import Path
          +from threading import Thread
          +from time import monotonic
          +
          +import pychromecast
          +from PySide6.QtCore import QObject, Property, QTimer, Signal, Slot
          +from pychromecast.response_handler import WaitResponse
          +
          +_AUDIO_TYPES = {
          +    ".aac": "audio/aac",
          +    ".flac": "audio/flac",
          +    ".m4a": "audio/mp4",
          +    ".mp3": "audio/mpeg",
          +    ".ogg": "audio/ogg",
          +    ".opus": "audio/ogg",
          +    ".wav": "audio/wav",
          +}
          +_BYTE_RANGE = re.compile(r"bytes=(\d{0,20})-(\d{0,20})")
          +
          +
          +class _TrackHandler(BaseHTTPRequestHandler):
          +    def log_message(self, *_args):
          +        pass
          +
          +    def do_HEAD(self):
          +        self._send_track(head=True)
          +
          +    def do_GET(self):
          +        self._send_track(head=False)
          +
          +    def do_OPTIONS(self):
          +        track = self.server.track
          +        if not track or self.path != track[0]:
          +            self.send_error(404)
          +            return
          +        self.send_response(204)
          +        self.send_header("Access-Control-Allow-Origin", "*")
          +        self.send_header("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS")
          +        self.send_header("Access-Control-Allow-Headers", "Range")
          +        self.send_header("Access-Control-Allow-Private-Network", "true")
          +        self.end_headers()
          +
          +    def _send_track(self, head):
          +        track = self.server.track
          +        if not track or self.path != track[0]:
          +            self.send_error(404)
          +            return
          +        _, path, mime = track
          +        try:
          +            source = path.open("rb")
          +        except OSError:
          +            self.send_error(404)
          +            return
          +        with source:
          +            size = source.seek(0, 2)
          +            start, end = 0, size - 1
          +            range_header = self.headers.get("Range")
          +            if range_header:
          +                match = _BYTE_RANGE.fullmatch(range_header)
          +                if match:
          +                    first, last = match.groups()
          +                    if first:
          +                        start = int(first)
          +                        end = min(end, int(last)) if last else end
          +                    elif last:
          +                        start = max(0, size - int(last))
          +                    else:
          +                        match = None
          +                if not match or start > end:
          +                    self.send_response(416)
          +                    self.send_header("Content-Range", f"bytes */{size}")
          +                    self.send_header("Content-Length", "0")
          +                    self.end_headers()
          +                    return
          +            remaining = end - start + 1
          +            self.send_response(206 if range_header else 200)
          +            self.send_header("Content-Type", mime)
          +            self.send_header("Content-Length", str(remaining))
          +            self.send_header("Accept-Ranges", "bytes")
          +            self.send_header("Access-Control-Allow-Origin", "*")
          +            if range_header:
          +                self.send_header("Content-Range", f"bytes {start}-{end}/{size}")
          +            self.end_headers()
          +            if head:
          +                return
          +            source.seek(start)
          +            try:
          +                while remaining and (block := source.read(min(remaining, 64 * 1024))):
          +                    self.wfile.write(block)
          +                    remaining -= len(block)
          +            except (BrokenPipeError, ConnectionResetError):
          +                pass
          +
          +
          +class _TrackServer(ThreadingHTTPServer):
          +    def __init__(self, host):
          +        with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as route:
          +            route.connect((host, 8009))
          +            interface = route.getsockname()[0]
          +        super().__init__((interface, 0), _TrackHandler)
          +        self.track = None
          +        Thread(target=self.serve_forever, kwargs={"poll_interval": 0.1}, daemon=True).start()
          +
          +    def offer(self, path):
          +        path = Path(path)
          +        extension = path.suffix.lower()
          +        mime = _AUDIO_TYPES[extension]
          +        route = f"/{secrets.token_urlsafe(24)}{extension}"
          +        self.track = (route, path, mime)
          +        host, port = self.server_address
          +        return f"http://{host}:{port}{route}", mime
          +
          +    def close(self):
          +        self.track = None
          +        self.shutdown()
          +        self.server_close()
          +
          +
          +def _discover():
          +    devices, browser = pychromecast.discover_chromecasts(timeout=5)
          +    try:
          +        return sorted(devices, key=lambda device: (device.friendly_name or "").casefold())
          +    finally:
          +        browser.stop_discovery()
          +
          +
          +def _connect(device):
          +    address = (device.host, device.port, device.uuid, device.model_name, device.friendly_name)
          +    cast = pychromecast.get_chromecast_from_host(address, tries=1, timeout=3)
          +    try:
          +        cast.wait(timeout=6)
          +        return cast, _TrackServer(device.host)
          +    except Exception:
          +        _disconnect(cast, None, None)
          +        raise
          +
          +
          +def _stop_media(cast, url):
          +    media = cast.media_controller
          +    if url and media.status.content_id == url and media.status.player_state != "IDLE":
          +        media.stop(timeout=2)
          +
          +
          +def _load_media(cast, url, mime, title, position, autoplay):
          +    response = WaitResponse(10, "Cast media load")
          +    cast.media_controller.play_media(
          +        url, mime, title=title, current_time=position / 1000,
          +        autoplay=autoplay, stream_type="BUFFERED", callback_function=response.callback,
          +    )
          +    response.wait_response()
          +
          +
          +def _disconnect(cast, server, url):
          +    try:
          +        _stop_media(cast, url)
          +    except Exception:
          +        logging.debug("Could not stop Cast playback", exc_info=True)
          +    finally:
          +        if server:
          +            server.close()
          +        try:
          +            cast.disconnect(timeout=2)
          +        except Exception:
          +            logging.debug("Cast socket did not close immediately", exc_info=True)
          +
          +
          +class CastOutput(QObject):
          +    devicesChanged = Signal()
          +    stateChanged = Signal()
          +    playbackChanged = Signal()
          +    timelineChanged = Signal()
          +    volumeChanged = Signal()
          +    connected = Signal()
          +    finished = Signal()
          +    failed = Signal(str)
          +
          +    def __init__(self, parent=None):
          +        super().__init__(parent)
          +        self._worker = ThreadPoolExecutor(max_workers=1, thread_name_prefix="JOLT Cast")
          +        self._job = None
          +        self._operation = ""
          +        self._devices = []
          +        self._cast = None
          +        self._server = None
          +        self._url = None
          +        self._start_ms = 0
          +        self._autoplay = False
          +        self._deadline = 0
          +        self._last_playing = False
          +        self._last_volume = None
          +        self._message = ""
          +        self._commands = []
          +        self._timer = QTimer(self, interval=200)
          +        self._timer.timeout.connect(self._poll)
          +        self._volume_timer = QTimer(self, singleShot=True, interval=180)
          +        self._volume_timer.timeout.connect(self._send_volume)
          +        self._requested_volume = 0.65
          +        self._seek_timer = QTimer(self, singleShot=True, interval=180)
          +        self._seek_timer.timeout.connect(self._send_seek)
          +        self._requested_position = 0
          +
          +    @Property("QVariantList", notify=devicesChanged)
          +    def devices(self):
          +        return [
          +            {"id": str(device.uuid), "name": device.friendly_name or "Cast device"}
          +            for device in self._devices
          +        ]
          +
          +    @Property(bool, notify=stateChanged)
          +    def busy(self):
          +        return self._job is not None
          +
          +    @Property(str, notify=stateChanged)
          +    def name(self):
          +        if self._cast:
          +            return self._cast.cast_info.friendly_name or "Cast device"
          +        return ""
          +
          +    @Property(str, notify=stateChanged)
          +    def message(self):
          +        return self._message
          +
          +    @Slot()
          +    def scan(self):
          +        if self.busy or self._cast:
          +            return
          +        self._devices = []
          +        self.devicesChanged.emit()
          +        self._start_job("scan", _discover, "Looking for Cast devices…")
          +
          +    @Slot(str)
          +    def connectDevice(self, device_id):
          +        if self.busy or self._cast:
          +            return
          +        for device in self._devices:
          +            if str(device.uuid) == device_id:
          +                self._start_job("connect", _connect, f"Connecting to {device.friendly_name or 'Cast device'}…", device)
          +                return
          +
          +    def _start_job(self, operation, work, message, *args):
          +        self._operation = operation
          +        self._job = self._worker.submit(work, *args)
          +        self._message = message
          +        self.stateChanged.emit()
          +        self._timer.start()
          +
          +    def _complete_job(self):
          +        job, self._job = self._job, None
          +        try:
          +            result = job.result()
          +        except Exception:
          +            logging.debug("Cast %s failed", self._operation, exc_info=True)
          +            self._message = (
          +                "Could not find Cast devices. Check your network and try again."
          +                if self._operation == "scan" else "Could not connect to the Cast device."
          +            )
          +        else:
          +            if self._operation == "scan":
          +                self._devices = result
          +                self._message = "" if result else "No Cast devices found on this network."
          +                self.devicesChanged.emit()
          +            else:
          +                self._cast, self._server = result
          +                self._message = ""
          +                self.connected.emit()
          +        self.stateChanged.emit()
          +
          +    @property
          +    def _status(self):
          +        if self._cast and self._url:
          +            status = self._cast.media_controller.status
          +            if status.content_id == self._url:
          +                return status
          +        return None
          +
          +    @property
          +    def playing(self):
          +        status = self._status
          +        return status.player_is_playing if status else bool(self._url and self._autoplay)
          +
          +    @property
          +    def resume_after_error(self):
          +        return self.playing or self._last_playing or bool(self._deadline and self._autoplay)
          +
          +    @property
          +    def position(self):
          +        status = self._status
          +        return round((status.adjusted_current_time or 0) * 1000) if status else self._start_ms
          +
          +    @property
          +    def duration(self):
          +        status = self._status
          +        return round((status.duration or 0) * 1000) if status else 0
          +
          +    @property
          +    def seekable(self):
          +        status = self._status
          +        return bool(status and status.supports_seek)
          +
          +    @property
          +    def volume(self):
          +        status = self._cast.status if self._cast else None
          +        return status.volume_level if status else self._requested_volume
          +
          +    def load(self, path, title, position=0, autoplay=True):
          +        self._url, mime = self._server.offer(path)
          +        self._start_ms = position
          +        self._autoplay = autoplay
          +        self._deadline = monotonic() + 20
          +        self._commands.append(self._worker.submit(
          +            _load_media, self._cast, self._url, mime, title, position, autoplay,
          +        ))
          +        self.playbackChanged.emit()
          +        self.timelineChanged.emit()
          +
          +    def _poll(self):
          +        if self._job and self._job.done():
          +            self._complete_job()
          +        for command in tuple(self._commands):
          +            if command.done():
          +                self._commands.remove(command)
          +                if command.exception():
          +                    self.failed.emit("The Cast device did not respond. Playing on this device.")
          +                    break
          +        if not self._cast:
          +            if not self.busy:
          +                self._timer.stop()
          +            return
          +        if not self._cast.socket_client.is_connected:
          +            self.failed.emit("Cast connection lost. Playing on this device.")
          +            return
          +        status = self._status
          +        if status and status.player_state == "IDLE" and status.idle_reason == "FINISHED":
          +            self._url = None
          +            self.finished.emit()
          +        elif status and status.player_state == "IDLE" and status.idle_reason == "ERROR":
          +            self.failed.emit("The Cast device could not play this track. Playing on this device.")
          +        elif status and status.player_state == "IDLE" and status.idle_reason in ("CANCELLED", "INTERRUPTED"):
          +            self.failed.emit("Cast playback stopped. JOLT switched back to this device.")
          +        elif status and status.player_state in ("PLAYING", "PAUSED"):
          +            self._deadline = 0
          +        elif self._deadline and monotonic() >= self._deadline:
          +            self.failed.emit("The Cast device did not start playback. Playing on this device.")
          +        playing, volume = self.playing, self.volume
          +        if playing != self._last_playing:
          +            self._last_playing = playing
          +            self.playbackChanged.emit()
          +        if volume != self._last_volume:
          +            self._last_volume = volume
          +            self.volumeChanged.emit()
          +        self.timelineChanged.emit()
          +
          +    def clear_track(self):
          +        self._seek_timer.stop()
          +        self._commands.clear()
          +        if self._cast and self._url:
          +            self._commands.append(self._worker.submit(_stop_media, self._cast, self._url))
          +        if self._server:
          +            self._server.track = None
          +        self._url = None
          +        self._deadline = 0
          +        self._start_ms = 0
          +
          +    def toggle(self):
          +        if self._status:
          +            controller = self._cast.media_controller
          +            method = controller.pause if self.playing else controller.play
          +            self._commands.append(self._worker.submit(method, timeout=2))
          +
          +    def seek(self, position):
          +        self._requested_position = position
          +        self._seek_timer.start()
          +
          +    def _send_seek(self):
          +        if self._status:
          +            self._commands.append(self._worker.submit(
          +                self._cast.media_controller.seek, self._requested_position / 1000, timeout=2,
          +            ))
          +
          +    def set_volume(self, volume):
          +        self._requested_volume = volume
          +        self._volume_timer.start()
          +
          +    def _send_volume(self):
          +        if self._cast:
          +            self._commands.append(self._worker.submit(self._cast.set_volume, self._requested_volume, timeout=2))
          +
          +    def release(self):
          +        if not self._cast:
          +            return
          +        self._volume_timer.stop()
          +        self._seek_timer.stop()
          +        self._server.track = None
          +        self._worker.submit(_disconnect, self._cast, self._server, self._url)
          +        self._cast = self._server = self._url = None
          +        self._deadline = 0
          +        self._start_ms = 0
          +        self._commands.clear()
          +        self.stateChanged.emit()
          +        self.playbackChanged.emit()
          +        self.timelineChanged.emit()
          +
          +    def close(self):
          +        self._timer.stop()
          +        self.release()
          +        if self._job and self._operation == "connect":
          +            self._job.add_done_callback(self._close_pending_connection)
          +        self._worker.shutdown(wait=False)
          +
          +    @staticmethod
          +    def _close_pending_connection(job):
          +        if not job.cancelled() and job.exception() is None:
          +            _disconnect(*job.result(), None)
          
